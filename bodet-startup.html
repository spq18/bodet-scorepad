<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodet Startup</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --amarelo: #f7c932;
    --amarelo-borda: #e8b923;
    --preto: #000;
    --verde: #138a1c;
    --azul: #0b0b8f;
    --branco: #fff;
    --vermelho: #e02020;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #222;
    font-family: 'Roboto', Arial, sans-serif;
    overflow: hidden;
  }

  /* Consola (caixa da mesa) com tamanho fixo 1340x680, escalada para caber na janela */
  #consola {
    position: absolute;
    left: 50%; top: 50%;
    width: 1340px; height: 680px;
    background: linear-gradient(#3a3a3a, #1c1c1c);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.12);
    transform-origin: center center;
    user-select: none;
  }

  /* Ecrã tátil 960x600 dentro da consola */
  #ecra {
    position: absolute;
    left: 190px; top: 40px;
    width: 960px; height: 600px;
    background: var(--preto);
    box-shadow: 0 0 0 6px #0d0d0d;
    overflow: hidden;
  }

  /* ---------- BARRA DE TOPO ---------- */
  #topo-esq {
    position: absolute; left: 0; top: 0;
    width: 290px; height: 68px;
    background: var(--amarelo);
    clip-path: polygon(0 0, 100% 0, 100% 66%, 77% 100%, 0 100%);
  }
  #topo-dir {
    position: absolute; left: 286px; top: 0;
    width: 674px; height: 46px;
    background: var(--amarelo);
    display: flex; align-items: center;
  }
  .topo-btn {
    position: absolute; top: 6px;
    width: 70px; height: 54px;
    display: flex; align-items: center; justify-content: center;
  }
  #btn-home { left: 22px; }
  #btn-menu { left: 128px; }
  #sep-menu {
    position: absolute; left: 118px; top: 10px;
    width: 2px; height: 46px; background: #333;
  }

  .icone-topo {
    height: 46px;
    display: flex; align-items: center; justify-content: center;
    border-right: 1.5px solid #333;
  }
  .icone-topo:last-child { border-right: none; }
  .icone-topo svg { display: block; }
  #ic-lock  { width: 64px; }
  #ic-luz   { width: 62px; }
  #ic-buz   { width: 62px; }
  #ic-rede  { width: 62px; }
  #ic-usb   { width: 62px; }
  #ic-bat   { width: 62px; }
  #ic-hora  { width: 190px; font-size: 24px; color: #222; }
  #ic-power { flex: 1; }

  /* ---------- BOAS-VINDAS ---------- */
  #boas-vindas {
    position: absolute; left: 0; top: 92px;
    width: 960px; text-align: center;
    color: #ddd;
    font-size: 24px;
  }

  /* ---------- GRELHA DE DESPORTOS ---------- */
  .desporto {
    position: absolute;
    width: 140px; height: 140px;
    border-radius: 4px;
    color: var(--branco);
    text-decoration: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    font-size: 15px;
    overflow: hidden;
    cursor: default;
  }
  .desporto svg { display: block; }
  .desporto span { position: relative; text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
  a.desporto { cursor: pointer; }
  .desporto.ativo { box-shadow: 0 0 0 4px #f4e7c4; }

  .laranja  { background: #f0a515; }
  .amarelo2 { background: #e2d21a; }
  .vermelho { background: #e04a1c; }
  .verde2   { background: #4aa63a; }
  .azul2    { background: #4a6fc0; }
  .celeste  { background: #b8dcf0; }

  /* colunas: 98, 264, 430, 596, 762 | linhas: 160, 345 */
  #d-andebol   { left: 98px;  top: 160px; }
  #d-basquete  { left: 264px; top: 160px; }
  #d-futsal    { left: 430px; top: 160px; }
  #d-tenis     { left: 596px; top: 160px; }
  #d-baseball  { left: 762px; top: 160px; }
  #d-badminton { left: 98px;  top: 345px; }
  #d-futebol   { left: 264px; top: 345px; }
  #d-hoquei    { left: 430px; top: 345px; }
  #d-rugby     { left: 596px; top: 345px; }
  #d-voleibol  { left: 762px; top: 345px; }

  #seta-dir {
    position: absolute; left: 918px; top: 280px;
  }

  /* ---------- BOTÃO DE BAIXO ---------- */
  .btn-baixo {
    position: absolute; top: 528px;
    width: 126px; height: 60px;
    border: 2px solid var(--amarelo-borda);
    border-radius: 4px;
    background: var(--preto);
    color: var(--amarelo);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    font-size: 14px;
  }
  #btn-settings { left: 417px; }

  /* ---------- BOTÕES FÍSICOS (fora do ecrã) ---------- */
  .painel-fisico {
    position: absolute; top: 40px;
    width: 140px; height: 600px;
  }
  #painel-esq { left: 25px; }
  #painel-dir { left: 1175px; }
  #marca {
    position: absolute; left: 0; top: 10px;
    width: 140px; text-align: center;
    color: #888;
    font-size: 20px; font-weight: 900; letter-spacing: 3px;
  }
  .botao-fisico {
    position: absolute; left: 20px;
    width: 100px; height: 100px;
    border-radius: 14px;
    font-size: 20px; font-weight: 900; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .botao-fisico {
    background: var(--amarelo);
    color: #222;
    box-shadow: 0 8px 0 #a8841a, 0 12px 14px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.45);
  }
  #btn-start, #btn-voltar { top: 170px; }
  #btn-stop,  #btn-horn   { top: 330px; }
  /* botão carregado: desce como um botão a sério */
  .botao-fisico.premido {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #a8841a, 0 4px 6px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.45);
  }
</style>
</head>
<body>

<div id="consola">

<div id="ecra">

  <!-- ===== BARRA DE TOPO ===== -->
  <div id="topo-esq"></div>
  <div id="sep-menu"></div>

  <div id="btn-home" class="topo-btn">
    <svg width="46" height="40" viewBox="0 0 46 40" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round">

    <div id="ic-buz" class="icone-topo">

        <path d="M8 22 C8 14 26 14 26 22 Z"/>

      </svg>
    </div>

    <div id="ic-usb" class="icone-topo">
      <svg width="34" height="20" viewBox="0 0 34 20" fill="#222" stroke="#222" stroke-width="2">
        <path d="M2 10 H30" fill="none"/>
        <circle cx="4" cy="10" r="3"/>
        <path d="M30 6 L34 10 L30 14 Z"/>
        <path d="M10 10 L15 3 H21" fill="none"/>

    <div id="ic-bat" class="icone-topo">
      <svg width="42" height="24" viewBox="0 0 42 24">
        <rect x="1.5" y="2" width="35" height="20" rx="2" fill="none" stroke="#222" stroke-width="2.5"/>
        <rect x="37" y="7" width="4" height="10" fill="#222"/>
        <text x="19" y="17" text-anchor="middle" font-family="Roboto, Arial" font-size="12" font-weight="700" fill="#222">100</text>
      </svg>
    </div>

    <div id="ic-hora" class="icone-topo">14:38</div>

    <div id="ic-power" class="icone-topo">
      <svg width="28" height="30" viewBox="0 0 28 30" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round">
        <path d="M14 2 V13"/>
        <path d="M7 6 a11 11 0 1 0 14 0"/>
      </svg>
    </div>
  </div>

  <!-- ===== BOAS-VINDAS ===== -->
  <div id="boas-vindas">Bem-vindo a BODET Scorepad</div>

  <!-- ===== GRELHA DE DESPORTOS (só o basquete tem ligação) ===== -->
  <div id="d-andebol" class="desporto laranja ativo">
    <svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="34" fill="#fff"/><g fill="none" stroke="#f0a515" stroke-width="3"><circle cx="38" cy="38" r="12"/><path d="M38 4 V26 M38 50 V72 M4 38 H26 M50 38 H72"/></g></svg>
    <span>Handball</span>
  </div>

    <svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="34" fill="#fff"/><g fill="none" stroke="#f0a515" stroke-width="3"><path d="M4 38 H72 M38 4 V72"/><path d="M14 14 C26 26 26 50 14 62 M62 14 C50 26 50 50 62 62"/></g></svg>
    <span>Basketball</span>
  </a>

    <span>Futsal</span>
  </div>
  <div id="d-tenis" class="desporto amarelo2">
    <svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="34" fill="#fff"/><g fill="none" stroke="#e2d21a" stroke-width="3"><path d="M12 16 C30 28 30 48 12 60 M64 16 C46 28 46 48 64 60"/></g></svg>
    <span>Tennis</span>
  </div>
  <div id="d-baseball" class="desporto vermelho">
    <svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="34" fill="#fff"/><g fill="none" stroke="#e04a1c" stroke-width="3"><path d="M20 10 C30 26 30 50 20 66 M56 10 C46 26 46 50 56 66" stroke-dasharray="4 3"/></g></svg>

  </div>

  <!-- ===== SETA PÁGINA SEGUINTE ===== -->

    <path d="M6 6 L22 27 L6 48"/>

  <!-- ===== BOTÃO DE BAIXO ===== -->

<!-- ===== BOTÕES FÍSICOS DA CONSOLA (fora do ecrã) ===== -->
<div id="painel-esq" class="painel-fisico">
  <div id="btn-start" class="botao-fisico">START</div>
  <div id="btn-stop" class="botao-fisico">STOP</div>
</div>

<div id="painel-dir" class="painel-fisico">
  <div id="marca">BODET</div>
  <div id="btn-voltar" class="botao-fisico">
    <svg width="44" height="30" viewBox="0 0 44 30" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 15 H6 M16 4 L5 15 L16 26"/>
    </svg>
  </div>
  <div id="btn-horn" class="botao-fisico">
    <!-- buzina: caixinha à esquerda e corneta a abrir para a direita -->
    <svg width="50" height="34" viewBox="0 0 50 34" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round">
      <rect x="3" y="15" width="13" height="14" rx="2"/>
      <path d="M16 15 L46 4 V29 H16"/>
    </svg>
  </div>
</div>

</div>

<script>
  // Escala a consola 1340x680 para caber na janela, mantendo a proporção
  function ajustarEscala() {
    const consola = document.getElementById('consola');
    const escala = Math.min(window.innerWidth / 1340, window.innerHeight / 680);
    consola.style.transform = 'translate(-50%, -50%) scale(' + escala + ')';
  }
  window.addEventListener('resize', ajustarEscala);
  ajustarEscala();

  // Botões físicos: descem enquanto estão premidos (neste ecrã ainda não fazem nada)
  function botaoFisico(botao, acao) {
    function soltar() { botao.classList.remove('premido'); }
    botao.addEventListener('mousedown', function () {
      botao.classList.add('premido');
      acao();
    });
    botao.addEventListener('mouseup', soltar);
    botao.addEventListener('mouseleave', soltar);
  }
  botaoFisico(document.getElementById('btn-start'), function () {});
  botaoFisico(document.getElementById('btn-stop'), function () {});
  botaoFisico(document.getElementById('btn-voltar'), function () {});
  botaoFisico(document.getElementById('btn-horn'), function () {});
</script>

</body>
</html>
